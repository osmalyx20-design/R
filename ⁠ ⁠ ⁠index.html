<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة لرزونتي ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            zoom: 1.15; 
        }

        .question-card, .love-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 2px solid #ff4d6d;
            text-align: center;
            max-width: 320px;
            z-index: 20;
            transition: all 0.5s ease;
        }

        .love-card { display: none; opacity: 0; }

        h1 { color: #590d22; font-size: 22px; margin-bottom: 20px; }
        p { color: #590d22; font-size: 15px; line-height: 1.8; margin-bottom: 20px; }

        .btn {
            background: #ff4d6d;
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            text-decoration: none;
        }

        .btn:hover { background: #d81159; transform: scale(1.05); }

        .heart-rain {
            position: absolute;
            top: -10%;
            font-size: 20px;
            color: #ff4d6d;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to { top: 110%; transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="question-card" id="qCard">
        <h1>مستعدة رزونتي؟ 🩵</h1>
        <button class="btn" onclick="revealGift()">إييي!</button>
    </div>

    <div class="love-card" id="lCard">
        <h1>أنتِ أجمل النعم ❤️</h1>
        <p>
            يا أغلى رزونة في هالدنيا وكل ما فيها..<br>
            جيتِ نورتِ قلبي ورسمتِ ضحكة ما تفارق وجهي. عيونكِ فيها كل فرح هالدنيا، وكلماتكِ تشفي الروح. <br><br>
            أنتِ السعادة اللي تمنيتها، والوردة اللي فاحت في بستاني، والهدية اللي مستحيل أفرط فيها. أحبكِ بكل معاني الكلمة، وأكثر مما تتخيلين!
        </p>
    </div>

    <script>
        function revealGift() {
            document.getElementById('qCard').style.display = 'none';
            const lCard = document.getElementById('lCard');
            lCard.style.display = 'block';
            setTimeout(() => { lCard.style.opacity = '1'; }, 50);
            setInterval(createHeart, 400);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-rain');
            heart.innerText = ['❤️', '💖', '💗', '💕'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 5 + 5 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 10000);
        }
    </script>
</body>
</html>
